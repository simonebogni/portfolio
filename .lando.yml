name: portfolio
recipe: lamp
config:
  php: '8.5'
  via: apache
  webroot: ./public
  database: postgres
  cache: redis
  xdebug: true
services:
  appserver:
    scanner:
      okCodes:
        - 401
      path: /admin/login
    build_as_root:
      # Note that you will want to use the script for the major version of node you want to install
      # See: https://github.com/nodesource/distributions/blob/master/README.md#installation-instructions
      - curl -sL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get install -y nodejs
      - npm i
  database:
    portforward: 23507
tooling:
  npm:
    service: appserver
    cmd:
      - npm
  build:
    service: appserver
    description: Builds the client and SSR bundles (npm run build)
    cmd:
      - npm run build
  ssr:
    service: appserver
    description: Starts the Inertia SSR server (run "lando build" first)
    cmd:
      - php artisan inertia:start-ssr
  test:
    service: appserver
    description: Runs the Pest test suite in parallel
    cmd:
      - ./vendor/bin/pest --parallel
  test-coverage-html:
    service: appserver
    description: Runs Pest in parallel and writes an HTML coverage report to storage/app/coverage
    cmd:
      - XDEBUG_MODE=coverage ./vendor/bin/pest --parallel --coverage-html=storage/app/coverage
  php:
    service: appserver
  pest:
    service: appserver
    description: Runs Pest with Xdebug coverage enabled (accepts any Pest option)
    cmd:
      - XDEBUG_MODE=coverage ./vendor/bin/pest
  pint:
    service: appserver
    cmd:
      - ./vendor/bin/pint
  larastan:
    service: appserver
    cmd:
      - ./vendor/bin/phpstan analyze --memory-limit=2G
  rector:
    service: appserver
    description: Applies Rector refactorings (use "lando rector --dry-run" to preview)
    cmd:
      - ./vendor/bin/rector process
