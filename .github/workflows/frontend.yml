name: Front end

on:
  workflow_call:

jobs:
  frontend:
    name: "Lint, types, tests and build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint, including the Feature-Sliced Design boundaries)
        run: npm run lint
      - name: Type check (vue-tsc)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build (client and SSR bundles)
        run: npm run build
